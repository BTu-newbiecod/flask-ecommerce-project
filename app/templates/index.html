{% extends "base.html" %}

{% block title %}Trang Chủ{% endblock %}

{% block head_css %}
{{ super() }}
<style>
    body {
        background-image: url("{{ url_for('static', filename='assets/images/bg-login.png') }}");
        background-size: cover;
        background-position: center 50px;
        background-repeat: no-repeat;
        background-attachment: fixed;
        margin: 0;
        padding: 0;
        height: 110vh;
    }

    .right-container {
        position: absolute;
        top: 0;
        left: 50%; 
        width: 50%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    .content-box {
        background-color: rgba(255,255,255,0.15);
        backdrop-filter: blur(6px);
        padding: 40px 30px;
        border-radius: 20px;
        color: #fff;
    }

    .content-box h1 {
        margin: 0;
        font-size: 2.5rem;
        text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
    }

    .content-box p {
        margin-top: 1rem;
        font-size: 1.2rem;
        text-shadow: 1px 1px 6px rgba(0,0,0,0.5);
    }

    .content-box a.btn {
        margin-top: 2rem;
        padding: 12px 30px;
        border-radius: 30px;
        font-weight: 500;
        font-size: 1rem;
        transition: background-color 0.3s ease, transform 0.2s ease;
    }
</style>
{% endblock %}

{% block content %}
<div class="right-container">
    <div class="content-box">
        <h1>Pypy Store</h1>
        <p>Mua sắm dễ dàng – Chất lượng đảm bảo – Giá cả hợp lý</p>
        <a href="{{ url_for('main.product_list') }}" class="btn btn-dark">Xem sản phẩm</a>
    </div>
</div>
{% endblock %}

{% block scripts %}
{% endblock %}
