<form id="product-form" enctype="multipart/form-data" method="POST">
  <div class="mb-3">
    <label for="name" class="form-label">Tên sản phẩm</label>
    <input type="text" class="form-control" id="name" name="name"
           value="{{ product.name if product else '' }}" required>
  </div>

  <div class="mb-3">
    <label for="description" class="form-label">Mô tả</label>
    <textarea class="form-control" id="description" name="description" rows="3">{{ product.description if product else '' }}</textarea>
  </div>

  <div class="mb-3">
    <label for="old-price" class="form-label">Giá cũ (VNĐ)</label>
    <input type="number" class="form-control" id="old-price" name="old-price"
           value="{{ product.old_price if product else '' }}" min="0" step="1000">
  </div>

  <div class="mb-3">
    <label for="price" class="form-label">Giá mới (VNĐ)</label>
    <input type="number" class="form-control" id="price" name="price"
           value="{{ product.price if product else '' }}" min="0" step="1000" required>
  </div>

  <div class="mb-3">
    <label for="stock" class="form-label">Số lượng trong kho</label>
    <input type="number" class="form-control" id="stock" name="stock"
           value="{{ product.stock if product else '' }}" min="0" required>
  </div>

  <div class="mb-3">
    <label for="img_file" class="form-label">Ảnh sản phẩm</label>
    {% if product and product.img_file %}
      <div class="mb-2 text-center">
        <img src="{{ url_for('static', filename='assets/images/products/' + product.img_file) }}"
             alt="{{ product.name }}"
             class="img-thumbnail"
             style="width:120px; height:120px; object-fit:cover;">
      </div>
    {% endif %}
    <input type="file" class="form-control" id="img_file" name="img_file" accept="image/*">
  </div>

  <div class="mb-3">
    <label for="category" class="form-label">Loại sản phẩm</label>
    <select class="form-select" id="category" name="category" required>
      {% for c in categories %}
      <option value="{{ c.id }}"
        {% if product and product.category_id == c.id %}selected{% endif %}>
        {{ c.name }}
      </option>
      {% endfor %}
    </select>
  </div>

  <!-- Nut xac nhan thao tac -->
  <div class="d-grid mt-3">
    <button type="submit" class="btn btn-dark" id="form-action-btn"></button>
  </div>
</form>
