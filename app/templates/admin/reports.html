{% extends "base.html" %}

{% block title %}Thống kê doanh thu{% endblock %}

{% block head_css %}
{{ super() }}
<style>
  body {
      background-color: #f6f6f6 !important;
  }
  .currency {
      display: inline-block; 
      font-size: 0.75em;       
      vertical-align: baseline;
      position: relative;
      top: -3px;           
      margin-left: 2px;
  }
  .chart-wrapper {
      max-width: 900px;
      margin: 0 auto;
  }
  .chart-container {
      width: 100%;
      padding: 20px;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      margin-top: 10px;
  }
  .chart-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      width: 100%;
  }
  #chartTypeSelect {
      width: auto;
  }
</style>
{% endblock %}

{% block content %}
<div class="container mt-5">

    <div class="chart-wrapper">
        <div class="chart-controls d-flex justify-content-between align-items-center" style="margin-right: 30px">
            <h3 class="mb-0">Thống kê năm {{ current_year }}</h3>
            <div class="d-flex align-items-center gap-10">
                <label for="chartTypeSelect" class="form-label mb-0 me-3">Loại:</label>
                <select id="chartTypeSelect" class="form-select form-select-sm mb-0 me-3">
                    <option value="bar" selected>Cột</option>
                    <option value="line">Đường</option>
                </select>

                <label for="dataTypeSelect" class="form-label mb-0 me-3">Theo:</label>
                <select id="dataTypeSelect" class="form-select form-select-sm mb-0">
                    <option value="revenue" selected>Doanh thu</option>
                    <option value="orders">Số đơn hàng</option>
                </select>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="revenueChart"></canvas>
        </div>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {

    // Dữ liệu từ Flask
    const monthlyLabels = {{ monthly_revenue.keys()|list|tojson|safe }};
    const monthlyRevenue = {{ monthly_revenue.values()|list|tojson|safe }};
    const monthlyOrders = {{ monthly_order_counts.values()|list|tojson|safe }}; // cần truyền từ Flask

    const ctxElement = document.getElementById('revenueChart');
    if (!ctxElement) {
        console.error("Không tìm thấy canvas với id='revenueChart'");
        return; 
    }
    const ctx = ctxElement.getContext('2d');

    let chartType = 'bar';   // Loại biểu đồ mặc định
    let dataType = 'revenue'; // Loại dữ liệu mặc định

    function createChart(type, dataType) {
        const data = dataType === 'revenue' ? monthlyRevenue : monthlyOrders;
        const label = dataType === 'revenue' ? 'Doanh thu (₫)' : 'Số đơn hàng';
        const yTitle = dataType === 'revenue' ? 'Doanh thu (₫)' : 'Số đơn hàng';

        return new Chart(ctx, {
            type: type,
            data: {
                labels: monthlyLabels,
                datasets: [{
                    label: label,
                    data: data,
                    backgroundColor: 'rgba(54, 162, 235, 0.6)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1,
                    fill: type !== 'line'
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: true },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const value = context.raw;
                                if (dataType === 'revenue') {
                                    return value.toLocaleString('vi-VN') + '₫';
                                }
                                return value;
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        title: {
                            display: true,
                            text: 'Tháng',
                            font: { size: 14, weight: 'bold' }
                        }
                    },
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: yTitle,
                            font: { size: 14, weight: 'bold' }
                        },
                        ticks: {
                            stepSize: dataType === 'orders' ? 1 : undefined,
                            callback: function(value) {
                                if (dataType === 'revenue') {
                                    return value.toLocaleString('vi-VN') + '₫';
                                }
                                return value;
                            }
                        }
                    }
                },
                onClick: function(evt, elements) {
                    if (elements.length > 0) {
                        const index = elements[0].index;
                        const year = {{ current_year }};
                        const url = "{{ url_for('admin.completed_orders') }}?month=" + (index + 1) + "&year=" + year;
                        window.location.href = url;
                    }
                }
            }
        });
    }

    // Khởi tạo chart lần đầu
    let revenueChart = createChart(chartType, dataType);

    // Dropdown chọn loại biểu đồ (Bar/Line)
    const chartTypeSelect = document.getElementById('chartTypeSelect');
    if (chartTypeSelect) {
        chartTypeSelect.addEventListener('change', function() {
            chartType = this.value;
            revenueChart.destroy();
            revenueChart = createChart(chartType, dataType);
        });
    }

    // Dropdown chọn loại dữ liệu (Doanh thu / Số đơn hàng)
    const dataTypeSelect = document.getElementById('dataTypeSelect');
    if (dataTypeSelect) {
        dataTypeSelect.addEventListener('change', function() {
            dataType = this.value;
            revenueChart.destroy();
            revenueChart = createChart(chartType, dataType);
        });
    }

});
</script>
{% endblock %}
